spark.master                            spark://spark-master:7077
spark.submit.deployMode                 client

# S3A / MinIO
spark.hadoop.fs.s3a.endpoint            http://minio:9000
spark.hadoop.fs.s3a.access.key          minioadmin
spark.hadoop.fs.s3a.secret.key          minioadmin123
spark.hadoop.fs.s3a.path.style.access   true
spark.hadoop.fs.s3a.impl                org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled false

# Hadoop-AWS jars (Spark 4 ships with Hadoop 3.4)
spark.jars.packages                     org.apache.hadoop:hadoop-aws:3.4.0,com.amazonaws:aws-java-sdk-bundle:1.12.262

# Event log → MinIO pipeline-logs/spark/
spark.eventLog.enabled                  true
spark.eventLog.dir                      s3a://pipeline-logs/spark/

# Dynamic allocation
spark.dynamicAllocation.enabled                 true
spark.dynamicAllocation.minExecutors            0
spark.dynamicAllocation.maxExecutors            2
spark.dynamicAllocation.initialExecutors        1
spark.dynamicAllocation.shuffleTracking.enabled true

# Resources
spark.executor.memory                   1g
spark.executor.cores                    1
spark.driver.memory                     512m

spark.serializer                        org.apache.spark.serializer.KryoSerializer

# Ivy JAR cache — /tmp is always writable by any user in any container
spark.jars.ivy                          /tmp/.ivy
