# ─────────────────────────────────────────────────────────────────
# spark-defaults.conf  –  shared by master & workers
# Configures S3A to talk to local MinIO
# ─────────────────────────────────────────────────────────────────

spark.master                            spark://spark-master:7077

# Deploy mode for submitted jobs (cluster = driver runs on worker)
spark.submit.deployMode                 client

# S3A / MinIO settings
spark.hadoop.fs.s3a.endpoint            http://minio:9000
spark.hadoop.fs.s3a.access.key         minioadmin
spark.hadoop.fs.s3a.secret.key         minioadmin123
spark.hadoop.fs.s3a.path.style.access  true
spark.hadoop.fs.s3a.impl               org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled false

# Extra JARs: Hadoop-AWS + AWS SDK (pulled via ivy on first run)
spark.jars.packages                     org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262

# Event log to MinIO
spark.eventLog.enabled                  true
spark.eventLog.dir                      s3a://spark-logs/

# Dynamic allocation (scale workers up/down with load)
spark.dynamicAllocation.enabled                 true
spark.dynamicAllocation.minExecutors            0
spark.dynamicAllocation.maxExecutors            4
spark.dynamicAllocation.initialExecutors        1
spark.dynamicAllocation.shuffleTracking.enabled true

# Executor resources
spark.executor.memory                   1g
spark.executor.cores                    1
spark.driver.memory                     512m

# Serializer
spark.serializer                        org.apache.spark.serializer.KryoSerializer
